[project]
name = "erpnextswiss"
authors = [
    { name = "libracore AG", email = "info@libracore.com"}
]
description = "ERPNext extension for Switzerland"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # dependencies
    "frappe>=15.0",
    "bs4",
    "factur-x>=2.3",
    "unidecode",
    "opencv-python",
    "pymupdf",
    "paramiko",
    "fintech",
    "pysftp",
    "icalendar",
    "lxml",
    "paramiko<4",
    "PyPika @  git+https://github.com/frappe/pypika@7ef6e40215d46cd531e8c4e58650b84c11abbd04"
]

[project.urls]
Homepage = "https://git.libracore.io/libracore/erpnextswiss"
Repository = "https://git.libracore.io/libracore/erpnextswiss.git"
"Bug Reports" = "https://git.libracore.io/libracore/erpnextswiss/issues"

[deploy.dependencies.apt]
packages = [
    "ffmpeg",
    "libsm6",
    "libxext6",
]
